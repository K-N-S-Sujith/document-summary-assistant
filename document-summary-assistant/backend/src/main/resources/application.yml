server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  upload:
    max-file-size-bytes: 10485760 # 10MB
  ai:
    provider: ${AI_PROVIDER:ollama}
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:http://localhost:11434/api/generate}
    model: ${AI_MODEL:codellama:latest}
  ocr:
    tessdata-path: ${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}

logging:
  level:
    com.example.documentsummary: INFO
